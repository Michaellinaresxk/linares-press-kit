      - region "The party is the point." [ref=f23e90]:
        - paragraph [ref=f23e91]: 02·The experience
        - heading "The party is the point." [level=2] [ref=f23e92]
        - paragraph [ref=f23e93]: "Linarex Experience is a live band built to do one thing: turn your venue into the best night of the week."
        - paragraph [ref=f23e94]: "Two artists — Colombia and the Dominican Republic — with their own music and years on stage, backed by a lineup of Warsaw-based professionals. They play the hits everyone knows and their own songs that hit just as hard: funk, pop, rock, Latin pop and afrobeat."
        - paragraph [ref=f23e95]: "Not a jukebox or background music: a real act that fills the floor, keeps the room moving and gives your crowd a reason to stay. Made for venues, bars, festivals and city or park events."
      - region "The energy" [ref=f23e96]:
        - paragraph [ref=f23e97]: 03·What happens
        - heading "The energy" [level=2] [ref=f23e98]
        - paragraph [ref=f23e99]: Dance. Jump. Sing every word.
        - paragraph [ref=f23e100]: Hit after hit, country after country — with original songs woven in that land just as hard. The crowd doesn’t sit still. From the first song to the last, the room stays alive.
