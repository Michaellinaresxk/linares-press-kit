      - region "Liczy się dobra zabawa." [ref=f26e90]:
        - paragraph [ref=f26e91]: 02·Doświadczenie
        - heading "Liczy się dobra zabawa." [level=2] [ref=f26e92]
        - paragraph [ref=f26e93]: Linarex Experience to zespół na żywo stworzony po to, by zamienić Twój lokal w najlepszy wieczór tygodnia.
        - paragraph [ref=f26e94]: "Dwóch artystów — z Kolumbii i Dominikany — z własną muzyką i wieloletnim doświadczeniem scenicznym, wspieranych przez skład warszawskich profesjonalistów. Grają hity, które znają wszyscy, oraz własne utwory, które brzmią równie mocno: funk, pop, rock, latin pop i afrobeat."
        - paragraph [ref=f26e95]: "To nie szafa grająca ani muzyka w tle: to prawdziwy zespół na imprezę, który zapełnia parkiet, utrzymuje energię i daje gościom powód, by zostać. Muzyka na żywo na koncerty w klubie i barze oraz eventy miejskie i plenerowe: venues, bars, festivals and city or park events."
      - region "Energia" [ref=f26e96]:
