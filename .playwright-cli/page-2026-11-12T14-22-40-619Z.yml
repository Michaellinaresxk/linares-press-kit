        - heading "The party is the point." [level=2] [ref=f2e60]
        - paragraph [ref=f2e61]: "Linarex Experience is a live band built to do one thing: turn your venue into the best night of the week."
        - paragraph [ref=f2e62]: "Two artists — Colombia and the Dominican Republic — with their own music and years on stage, backed by a lineup of Warsaw-based professionals. They play the hits everyone knows and their own songs that hit just as hard: funk, pop, rock, Latin pop and afrobeat."
        - paragraph [ref=f2e63]: "Not a jukebox or background music: a real act that fills the floor, keeps the room moving and gives your crowd a reason to stay. Made for venues, bars, festivals and city or park events."
      - region "The energy" [ref=f2e64]:
        - paragraph [ref=f2e65]: What happens
        - heading "The energy" [level=2] [ref=f2e66]
        - paragraph [ref=f2e67]: Dance. Jump. Sing every word.
        - paragraph [ref=f2e68]: Hit after hit, country after country — with original songs woven in that land just as hard. The crowd doesn’t sit still. From the first song to the last, the room stays alive.
