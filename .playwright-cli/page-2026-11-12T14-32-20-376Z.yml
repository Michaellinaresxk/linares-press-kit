      - region "The party is the point." [ref=e90]:
        - paragraph [ref=e91]: 02·The experience
        - heading "The party is the point." [level=2] [ref=e92]
        - paragraph [ref=e93]: "Linarex Experience is a live band built to do one thing: turn your venue into the best night of the week."
        - paragraph [ref=e94]: "Two artists — Colombia and the Dominican Republic — with their own music and years on stage, backed by a lineup of Warsaw-based professionals. They play the hits everyone knows and their own songs that hit just as hard: funk, pop, rock, Latin pop and afrobeat."
        - paragraph [ref=e95]: "Not a jukebox or background music: a real act that fills the floor, keeps the room moving and gives your crowd a reason to stay. Made for venues, bars, festivals and city or park events."
