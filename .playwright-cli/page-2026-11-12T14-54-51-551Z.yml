        - paragraph [ref=f6e99]: Dance. Jump. Sing every word.
        - paragraph [ref=f6e100]: Hit after hit, country after country — with original songs woven in that land just as hard. The crowd doesn’t sit still. From the first song to the last, the room stays alive.
